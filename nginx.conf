# Backend Django
upstream django_backend {
    server web:8000;
}

# Microservicio Flask
upstream flask_v2 {
    server pagos_flask:5000;
}

server {
    listen 80;

    # RUTA VIEJA: Sigue yendo a Django
    location /api/v1/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
    }

    # RUTA NUEVA: La compra ahora es procesada por Flask
    location /api/v2/comprar {
        proxy_pass http://flask_v2;
        proxy_set_header Host $host;
    }
}